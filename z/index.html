<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zikir Grubuna Davet - Namaz Vakti</title>
<link rel="icon" href="/favicon.ico">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #00695C 0%, #00897B 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #FFF;
    max-width: 420px;
    width: 100%;
    border-radius: 20px;
    padding: 32px 24px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .icon {
    font-size: 64px;
    margin-bottom: 12px;
  }
  h1 {
    color: #004D40;
    font-size: 22px;
    margin-bottom: 10px;
  }
  .subtitle {
    color: #00695C;
    font-size: 14px;
    margin-bottom: 24px;
    line-height: 1.5;
  }
  .code-box {
    background: #E0F2F1;
    border: 2px dashed #00897B;
    border-radius: 12px;
    padding: 16px;
    margin: 20px 0;
  }
  .code-label {
    font-size: 12px;
    color: #00695C;
    margin-bottom: 6px;
  }
  .code {
    font-family: 'SF Mono', Menlo, Monaco, monospace;
    font-size: 28px;
    font-weight: bold;
    color: #004D40;
    letter-spacing: 4px;
  }
  .copy-btn {
    background: #00897B;
    color: #FFF;
    border: none;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 12px;
    margin-top: 8px;
    cursor: pointer;
    font-weight: 600;
  }
  .copy-btn:active { transform: scale(0.95); }
  .stores {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 28px;
  }
  .store-btn {
    flex: 1;
    padding: 12px 16px;
    background: #333;
    color: #FFF;
    text-decoration: none;
    border-radius: 10px;
    font-weight: 600;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .store-btn:hover { background: #000; }
  .footer {
    margin-top: 24px;
    font-size: 12px;
    color: #00897B;
  }
  .lang-switch {
    text-align: right;
    margin-bottom: -16px;
  }
  .lang-switch button {
    background: transparent;
    border: 1px solid #00897B;
    color: #004D40;
    padding: 4px 10px;
    margin-left: 4px;
    border-radius: 6px;
    font-size: 11px;
    cursor: pointer;
  }
  .lang-switch button.active {
    background: #004D40;
    color: #FFF;
  }
</style>
</head>
<body>
<div class="card">
  <div class="lang-switch">
    <button data-lang="tr" class="active" onclick="setLang('tr')">TR</button>
    <button data-lang="en" onclick="setLang('en')">EN</button>
    <button data-lang="de" onclick="setLang('de')">DE</button>
  </div>
  <div class="icon">📿</div>
  <h1 data-tr="Zikir Grubuna Davet" data-en="Zikr Group Invitation" data-de="Einladung zur Zikr-Gruppe">Zikir Grubuna Davet</h1>
  <p class="subtitle"
     data-tr="Birlikte zikir çekmek için uygulamaya davet edildiniz. Namaz Vakti uygulamasını aç ve aşağıdaki davet kodunu gir."
     data-en="You've been invited to pray dhikr together. Open Namaz Vakti app and enter the invite code below."
     data-de="Sie sind eingeladen, gemeinsam Zikr zu machen. Öffne die Namaz Vakti App und gib den Einladungscode ein."
     >Birlikte zikir çekmek için uygulamaya davet edildiniz. Namaz Vakti uygulamasını aç ve aşağıdaki davet kodunu gir.</p>

  <div class="code-box">
    <div class="code-label" data-tr="Davet Kodu" data-en="Invite Code" data-de="Einladungscode">Davet Kodu</div>
    <div class="code" id="code">—</div>
    <button class="copy-btn" onclick="copyCode()" data-tr="Kopyala" data-en="Copy" data-de="Kopieren">Kopyala</button>
  </div>

  <div class="stores">
    <a class="store-btn" href="https://apps.apple.com/app/namaz-vakti/idXXXXXXXX" target="_blank">
      🍎 App Store
    </a>
    <a class="store-btn" href="https://play.google.com/store/apps/details?id=com.bayramgulac.namazvakti" target="_blank">
      ▶️ Play Store
    </a>
  </div>

  <div class="footer">Namaz Vakti · bgulac.github.io</div>
</div>

<script>
  // Get invite code from URL
  const params = new URLSearchParams(window.location.search);
  const code = (params.get('c') || '').toUpperCase();
  document.getElementById('code').textContent = code || '—';

  // Write code to clipboard for deferred deep linking (optional, best-effort)
  if (code) {
    try {
      navigator.clipboard.writeText(code).catch(() => {});
    } catch (_) {}
  }

  function copyCode() {
    if (!code) return;
    navigator.clipboard.writeText(code);
    const btn = document.querySelector('.copy-btn');
    const original = btn.textContent;
    btn.textContent = '✓';
    setTimeout(() => btn.textContent = original, 1500);
  }

  // Lang switch
  function setLang(lang) {
    document.querySelectorAll('.lang-switch button').forEach(b => {
      b.classList.toggle('active', b.dataset.lang === lang);
    });
    document.querySelectorAll('[data-' + lang + ']').forEach(el => {
      el.textContent = el.getAttribute('data-' + lang);
    });
    document.documentElement.lang = lang;
  }

  // Auto-detect browser language
  const browserLang = (navigator.language || 'tr').slice(0, 2);
  if (['tr','en','de'].includes(browserLang) && browserLang !== 'tr') {
    setLang(browserLang);
  }
</script>
</body>
</html>
